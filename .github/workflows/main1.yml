
name: Check ZIP Password Secret

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check ZIP_PASSWORD
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          if [ -n "$ZIP_PASSWORD" ]; then
            echo "ZIP_PASSWORD is configured."
          else
            echo "ZIP_PASSWORD is missing or unavailable."
          fi
