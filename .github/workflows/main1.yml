name: Recover Password (DELETE AFTER USE)

on:
  workflow_dispatch:   # manual only — never on push/PR

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - name: Hex-dump the secret
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          printf '%s' "$ZIP_PASSWORD" | od -An -tx1 | tr -d ' \n'
          echo
